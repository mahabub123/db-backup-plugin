name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Lets the release workflow run the same checks before publishing.
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Lint and build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # Also type-checks src/ (tsc emits the .d.ts files).
      - run: pnpm build

  test:
    name: Tests (${{ matrix.database }}, ${{ matrix.storage }} storage)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        database: [mongodb, postgres, sqlite]
        storage: [local, s3]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: payload_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_ADAPTER: ${{ matrix.database }}
      DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgres://postgres:postgres@127.0.0.1:5432/payload_test' || matrix.database == 'sqlite' && 'file:./dev/ci.db' || '' }}
      PAYLOAD_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Cache the in-memory MongoDB binary
        if: matrix.database == 'mongodb'
        uses: actions/cache@v6
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # moto is a local S3 emulator; the S3 tests are skipped without S3_ENDPOINT.
      - uses: actions/setup-python@v7
        if: matrix.storage == 's3'
        with:
          python-version: '3.13'
      - name: Start the S3 emulator
        if: matrix.storage == 's3'
        run: |
          python -m pip install --quiet "moto[server]"
          python -m moto.server -p 5000 > moto.log 2>&1 &
          for i in $(seq 60); do curl -sf http://127.0.0.1:5000 > /dev/null && break; sleep 1; done
          if ! curl -sf -X PUT http://127.0.0.1:5000/payload-backups-ci; then
            cat moto.log
            exit 1
          fi
          {
            echo "S3_ENDPOINT=http://127.0.0.1:5000"
            echo "S3_BUCKET=payload-backups-ci"
            echo "S3_REGION=us-east-1"
            echo "S3_ACCESS_KEY_ID=test"
            echo "S3_SECRET_ACCESS_KEY=test"
          } >> "$GITHUB_ENV"

      - run: pnpm test:int
